name: Gerar APK da Shekinah

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/gerar-apk.yml"

permissions:
  contents: write

jobs:
  gerar-apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.13"

      - name: Compilar o APK
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo para download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Shekinah.apk

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Shekinah-APK
          path: Shekinah.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar link permanente do APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view aplicativo-shekinah >/dev/null 2>&1; then
            gh release upload aplicativo-shekinah Shekinah.apk --clobber
          else
            gh release create aplicativo-shekinah Shekinah.apk \
              --target "$GITHUB_SHA" \
              --title "Aplicativo Shekinah" \
              --notes "APK oficial do Centro de Ensino Shekinah para instalação em celulares Android."
          fi
